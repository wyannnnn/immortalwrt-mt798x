name: Build ImmortalWrt for AX6000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses-dev libssl-dev python3-venv rsync unzip zlib1g-dev \
        file wget

    - name: Sync with upstream and update feeds
      run: |
        # 与 hanwckf 的仓库保持同步
        git pull origin openwrt-21.02
        # 更新软件源定义
        ./scripts/feeds update -a
        # 安装所有软件包
        ./scripts/feeds install -a
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8

    - name: Use official device config
      run: |
        cp defconfig/mt7986-ax6000.config .config
        
    - name: Finalize config
      run: |
        make defconfig
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8
            
    - name: Make download
      run: |
        # -j1 anstead of -j$(nproc)
        make download -j1
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8

    - name: Compile the firmware
      run: |
        make -j$(nproc) V=s
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: immortalwrt-ax6000-firmware
        path: bin/targets/mediatek/filogic/*
