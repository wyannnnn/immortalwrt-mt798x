name: Build ImmortalWrt for AX6000 (Debug Log)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
        file wget

    - name: Use official device config
      run: |
        cp defconfig/mt7986-ax6000.config .config
        
    - name: Update and install feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Finalize config
      run: |
        make defconfig
            
    - name: Make download
      run: |
        make download -j$(nproc)

    - name: Compile the firmware (Log to file)
      run: |
        # 使用 tee 命令将日志输出到 build.log 文件，同时在屏幕上显示
        # `|| true` 确保即使 make 命令失败，这个步骤也会被标记为成功，以便后续上传日志
        make -j$(nproc) V=s 2>&1 | tee build.log || true
      env:
        LANG: C.UTF-8
        LC_ALL: C.UTF-8

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: immortalwrt-ax6000-firmware
        path: bin/targets/mediatek/filogic/*

    - name: Upload build log
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
