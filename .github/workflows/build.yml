name: Build ImmortalWrt for AX6000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
        file wget

    - name: Use official device config
      run: |
        # 将作者预设的AX6000配置模板复制到 .config
        cp defconfig/mt7986-ax6000.config .config
        
    - name: Update and install feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Finalize config
      run: |
        # 让系统根据 .config 文件自动展开所有依赖项
        make defconfig
            
    - name: Make download
      run: |
        make download -j$(nproc)

    - name: Compile the firmware
      run: |
        make -j$(nproc) V=s

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: immortalwrt-ax6000-firmware
        path: bin/targets/mediatek/filogic/*
